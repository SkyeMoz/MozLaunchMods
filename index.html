<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f9ff" />
  <title>MozLaunch</title>
  <style>
    :root{
      --bg0:#f7f9ff; --bg1:#eef3ff; --bg2:#ffffff;
      --glass:rgba(255,255,255,.64); --glass-strong:rgba(255,255,255,.80);
      --line:rgba(15,23,42,.08); --text:#0f172a; --muted:#64748b;
      --accent:#2563eb; --accent-2:#8b5cf6; --accent-3:#06b6d4;
      --shadow:0 24px 70px rgba(15,23,42,.10); --shadow-soft:0 14px 36px rgba(15,23,42,.08);
      --nav-h:74px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 18%,rgba(37,99,235,.10),transparent 26%),
        radial-gradient(circle at 85% 8%,rgba(139,92,246,.10),transparent 24%),
        radial-gradient(circle at 55% 100%,rgba(6,182,212,.08),transparent 22%),
        linear-gradient(180deg,var(--bg2) 0%,var(--bg0) 45%,var(--bg1) 100%);
      overflow-x:hidden;user-select:none;-webkit-user-select:none
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;
      background:linear-gradient(120deg,rgba(255,255,255,.88),transparent 20%,rgba(255,255,255,.20)),
                 radial-gradient(circle at 50% 0%,rgba(255,255,255,.70),transparent 34%);
      z-index:0;
    }
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
    #bgCanvas{z-index:0} #fxCanvas{z-index:1}
    .app{position:relative;z-index:2;min-height:100vh;padding:20px}
    .wrap{width:min(1320px,100%);margin:0 auto;display:grid;gap:16px;padding-top:calc(var(--nav-h) + 10px)}
    .glass{background:linear-gradient(180deg,var(--glass-strong),var(--glass));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%)}

    .nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(1320px,calc(100% - 24px));height:var(--nav-h);border-radius:999px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px 12px 16px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;padding:6px 10px 6px 6px;border-radius:999px;transition:transform 160ms ease,background 160ms ease,box-shadow 160ms ease}
    .brand:hover{transform:translateY(-1px);background:rgba(255,255,255,.34);box-shadow:0 10px 24px rgba(15,23,42,.05)}
    .brandMark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:0 0 auto;background:linear-gradient(135deg,rgba(37,99,235,1),rgba(139,92,246,1));box-shadow:0 14px 28px rgba(37,99,235,.22)}
    .brandText{min-width:0;display:grid;gap:2px}.brandText strong{font-size:1rem;line-height:1.1;letter-spacing:.2px}.brandText span{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
    .navCenter{display:flex;align-items:center;gap:10px;flex:1;justify-content:center;min-width:0}
    .navLink{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:800;font-size:.92rem;padding:10px 14px;border-radius:999px;cursor:pointer;transition:transform 160ms ease,background 160ms ease,color 160ms ease,border-color 160ms ease,box-shadow 160ms ease;text-decoration:none;white-space:nowrap}
    .navLink:hover,.navLink.active{color:var(--text);background:rgba(255,255,255,.72);border-color:rgba(37,99,235,.14);box-shadow:0 10px 24px rgba(15,23,42,.06);transform:translateY(-1px)}
    .navRight{display:flex;align-items:center;gap:10px;flex:0 0 auto}
    .iconBtn{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.72);color:var(--text);cursor:pointer;transition:transform 160ms ease,border-color 160ms ease,box-shadow 160ms ease,background 160ms ease}
    .iconBtn:hover{transform:translateY(-1px);border-color:rgba(37,99,235,.18);box-shadow:0 12px 24px rgba(15,23,42,.08);background:rgba(255,255,255,.90)}

    .hero{border-radius:36px;padding:22px;animation:rise .7s ease both}
    .heroTop{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}
    .heroCopy{display:grid;gap:14px;align-content:start;min-width:0}
    .heroBadgeRow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 14px;font-size:.88rem;font-weight:800;border:1px solid rgba(37,99,235,.12);background:rgba(255,255,255,.66);color:var(--text);box-shadow:0 10px 20px rgba(15,23,42,.05)}
    .hero h1{margin:0;font-size:clamp(2rem,4vw,3.8rem);line-height:1;letter-spacing:-.03em}
    .hero p{margin:0;max-width:62ch;color:var(--muted);line-height:1.6;font-size:1rem}
    .heroStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .statCard{border-radius:24px;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,.50));border:1px solid rgba(15,23,42,.07);box-shadow:var(--shadow-soft);min-height:106px;display:grid;align-content:space-between;gap:12px}
    .statIcon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.10)}
    .statCard strong{display:block;font-size:1.2rem;line-height:1.1;margin-top:2px}
    .statCard span{font-size:.88rem;color:var(--muted)}

    .toolbar{border-radius:28px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;animation:rise .78s ease both}
    .search{position:relative;min-width:0}
    .search input{width:100%;border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.84);color:var(--text);padding:16px 16px 16px 50px;border-radius:18px;outline:none;font-size:1rem;transition:border-color 160ms ease,box-shadow 160ms ease,transform 160ms ease,background 160ms ease;user-select:text;-webkit-user-select:text}
    .search input:focus{border-color:rgba(37,99,235,.26);box-shadow:0 0 0 4px rgba(37,99,235,.10);transform:translateY(-1px);background:rgba(255,255,255,.95)}
    .searchIcon{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.78;pointer-events:none}
    .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .chip{border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.70);color:var(--muted);padding:11px 14px;border-radius:999px;font-size:.9rem;font-weight:800;cursor:pointer;transition:transform 160ms ease,background 160ms ease,color 160ms ease,border-color 160ms ease,box-shadow 160ms ease;display:inline-flex;align-items:center;gap:8px}
    .chip:hover,.chip.active{transform:translateY(-1px);color:var(--text);background:rgba(255,255,255,.92);border-color:rgba(37,99,235,.16);box-shadow:0 12px 24px rgba(15,23,42,.08)}
    .count{white-space:nowrap;color:var(--muted);font-weight:800;padding:11px 14px;border-radius:999px;border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.68)}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding-bottom:8px}
    .card{position:relative;overflow:hidden;border-radius:30px;border:1px solid rgba(15,23,42,.08);background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.68));backdrop-filter:blur(24px) saturate(165%);-webkit-backdrop-filter:blur(24px) saturate(165%);box-shadow:var(--shadow-soft);padding:18px;opacity:0;transform:translateY(18px) scale(.985);animation:cardIn .72s ease forwards;transition:transform 180ms ease,border-color 180ms ease,box-shadow 180ms ease;min-height:340px;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:14px}
    .card:hover{transform:translateY(-4px) scale(1);border-color:rgba(37,99,235,.16);box-shadow:0 26px 54px rgba(15,23,42,.12)}
    .cardGlow{position:absolute;inset:auto -20% -30% auto;width:250px;height:250px;background:radial-gradient(circle,rgba(37,99,235,.10),transparent 72%);pointer-events:none;filter:blur(10px)}
    .cardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .appInfo{display:flex;gap:14px;min-width:0;flex:1}
    .appThumb{width:74px;height:74px;border-radius:22px;overflow:hidden;flex:0 0 auto;background:linear-gradient(135deg,rgba(37,99,235,.10),rgba(139,92,246,.10));border:1px solid rgba(15,23,42,.08);box-shadow:0 14px 24px rgba(15,23,42,.05);display:grid;place-items:center}
    .appThumb img{width:100%;height:100%;object-fit:cover;display:block}
    .appIconFallback{color:currentColor}
    .appText{min-width:0;flex:1;display:grid;gap:7px}
    .titleRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .titleRow h2{margin:0;font-size:1.06rem;line-height:1.15;letter-spacing:-.02em}
    .tag{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:.76rem;font-weight:900;letter-spacing:.2px;color:#1d4ed8;border:1px solid rgba(37,99,235,.14);background:rgba(37,99,235,.08)}
    .desc{margin:0;color:var(--muted);line-height:1.56;font-size:.96rem;min-height:3.1lh}
    .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#334155;font-size:.88rem;font-weight:700;padding-top:2px}
    .metaItem{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.66);border:1px solid rgba(15,23,42,.06)}
    .launchBtn{width:100%;border:0;border-radius:18px;padding:13px 16px;color:#fff;cursor:pointer;font-weight:900;font-size:.98rem;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 16px 28px rgba(37,99,235,.18);transition:transform 160ms ease,filter 160ms ease,box-shadow 160ms ease,opacity 160ms ease}
    .launchBtn:hover{transform:translateY(-1px);filter:brightness(1.03);box-shadow:0 18px 30px rgba(15,23,42,.10)}
    .launchBtn:disabled{opacity:.82;cursor:wait;transform:none}
    .progress{display:none;gap:10px;padding-top:2px}
    .progress.active{display:grid}
    .progressTop{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#334155;font-size:.87rem;font-weight:800}
    .bar{height:11px;border-radius:999px;overflow:hidden;border:1px solid rgba(15,23,42,.08);background:rgba(15,23,42,.05)}
    .bar>span{display:block;height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-3),var(--accent-2));transition:width 120ms linear}
    .empty{grid-column:1 / -1;padding:40px 20px;text-align:center;color:var(--muted);border-radius:28px;border:1px dashed rgba(15,23,42,.16);background:rgba(255,255,255,.66);backdrop-filter:blur(18px)}
    .footer{color:rgba(15,23,42,.46);font-size:.84rem;text-align:center;padding:2px 0 10px}
    .srOnly{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    ::selection{background:rgba(37,99,235,.18);color:#0f172a}
    ::-moz-selection{background:rgba(37,99,235,.18);color:#0f172a}
    img,a,button,input,textarea{-webkit-user-drag:none}
    svg{display:block;flex:0 0 auto}
    @keyframes rise{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:1060px){
      .heroTop{grid-template-columns:1fr}
      .heroStats{grid-template-columns:repeat(3,1fr)}
      .navCenter{display:none}
      .nav{justify-content:space-between}
    }
    @media (max-width:760px){
      .app{padding:8px}
      .nav{width:calc(100% - 12px);height:64px;padding:8px 10px;top:6px}
      .brandText span{max-width:18ch}
      .wrap{padding-top:calc(64px + 8px);gap:10px}
      .hero,.toolbar{border-radius:22px}
      .heroStats{grid-template-columns:1fr}
      .toolbar{grid-template-columns:1fr}
      .controls{justify-content:flex-start}
      .count{justify-self:start}
      .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
      .card{
        min-height:0;
        padding:10px;
        border-radius:18px;
        gap:8px;
        grid-template-rows:auto auto auto auto;
      }
      .cardTop{gap:8px}
      .appInfo{gap:8px}
      .appThumb{width:44px;height:44px;border-radius:14px}
      .titleRow{gap:6px}
      .titleRow h2{font-size:.78rem;line-height:1.12}
      .tag{display:none}
      .desc{display:none}
      .meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:.72rem;padding-top:0}
      .metaItem{padding:6px 8px;border-radius:12px;gap:5px;max-width:100%}
      .metaItem svg{width:12px;height:12px}
      .actions{display:none}
      .likeBtn{
        width:100%;
        padding:7px 8px;
        font-size:.72rem;
        gap:6px;
        border-radius:999px;
      }
      .likeCount{font-size:.7rem}
      .progress{padding-top:0;gap:6px}
      .progressTop{font-size:.7rem}
      .bar{height:8px}
      .drawer{width:calc(100vw - 12px);height:calc(100vh - 12px);margin:6px;padding:14px;border-radius:24px}
      .drawerLink{justify-content:flex-start}
      .themeSwitch{min-width:auto;padding:6px 10px}
      .themeLabel{display:none}
    }
  
    body[data-scheme="navy"]{
      --bg0:#07111f; --bg1:#0d1a2d; --bg2:#0a1424;
      --glass:rgba(8,18,34,.58); --glass-strong:rgba(10,20,38,.82);
      --line:rgba(148,163,184,.14); --text:#eef4ff; --muted:#b8c3da;
      --accent:#0f4c81; --accent-2:#1d6fa8; --accent-3:#4ea0ff;
      --shadow:0 24px 70px rgba(2,8,23,.36); --shadow-soft:0 14px 36px rgba(2,8,23,.24);
    }
    body[data-scheme="navy"]{
      background:
        radial-gradient(circle at 10% 15%,rgba(15,76,129,.30),transparent 24%),
        radial-gradient(circle at 85% 8%,rgba(78,160,255,.16),transparent 24%),
        radial-gradient(circle at 55% 100%,rgba(29,111,168,.10),transparent 22%),
        linear-gradient(180deg,var(--bg2) 0%,var(--bg0) 45%,var(--bg1) 100%);
    }
    body[data-scheme="navy"] .navLink.active,
    body[data-scheme="navy"] .chip.active,
    body[data-scheme="navy"] .iconBtn,
    body[data-scheme="navy"] .count,
    body[data-scheme="navy"] .drawerLink,
    body[data-scheme="navy"] .themeSwitch,
    body[data-scheme="navy"] .card,
    body[data-scheme="navy"] .statCard,
    body[data-scheme="navy"] .hero,
    body[data-scheme="navy"] .toolbar,
    body[data-scheme="navy"] .empty{
      border-color: rgba(148,163,184,.14);
    }
    body[data-scheme="navy"] .glass{
      background:linear-gradient(180deg,rgba(8,18,34,.78),rgba(8,18,34,.58));
    }
    body[data-scheme="navy"] .brand:hover,
    body[data-scheme="navy"] .iconBtn,
    body[data-scheme="navy"] .chip,
    body[data-scheme="navy"] .count,
    body[data-scheme="navy"] .themeSwitch,
    body[data-scheme="navy"] .drawerLink,
    body[data-scheme="navy"] .launchBtn,
    body[data-scheme="navy"] .likeBtn,
    body[data-scheme="navy"] .search input,
    body[data-scheme="navy"] .statCard,
    body[data-scheme="navy"] .hero,
    body[data-scheme="navy"] .toolbar,
    body[data-scheme="navy"] .card,
    body[data-scheme="navy"] .empty,
    body[data-scheme="navy"] .metaItem,
    body[data-scheme="navy"] .modalCard{
      background:rgba(8,18,34,.72);
      color:var(--text);
    }
    body[data-scheme="navy"] .brand:hover,
    body[data-scheme="navy"] .iconBtn:hover,
    body[data-scheme="navy"] .chip:hover,
    body[data-scheme="navy"] .chip.active,
    body[data-scheme="navy"] .count,
    body[data-scheme="navy"] .themeSwitch:hover,
    body[data-scheme="navy"] .drawerLink:hover{
      background:rgba(15,29,51,.90);
    }
    body[data-scheme="navy"] .search input::placeholder{color:rgba(184,195,218,.72)}
    body[data-scheme="navy"] .search input{border-color:rgba(148,163,184,.14)}
    body[data-scheme="navy"] .statCard{background:linear-gradient(180deg,rgba(14,25,45,.92),rgba(8,18,34,.72))}
    body[data-scheme="navy"] .hero{background:linear-gradient(180deg,rgba(14,25,45,.92),rgba(8,18,34,.74))}
    body[data-scheme="navy"] .toolbar{background:linear-gradient(180deg,rgba(14,25,45,.92),rgba(8,18,34,.74))}
    body[data-scheme="navy"] .card{background:linear-gradient(180deg,rgba(14,25,45,.92),rgba(8,18,34,.74))}
    body[data-scheme="navy"] .metaItem{border-color:rgba(148,163,184,.14)}
    body[data-scheme="navy"] .launchBtn{background:linear-gradient(135deg,#0f4c81,#1d6fa8)}
    body[data-scheme="navy"] .likeBtn{border-color:rgba(34,197,94,.28);background:rgba(34,197,94,.14)}
    body[data-scheme="navy"] .likeBtn:hover{background:rgba(34,197,94,.20)}
    body[data-scheme="navy"] .drawer{background:linear-gradient(180deg,rgba(14,25,45,.96),rgba(8,18,34,.86))}
    body[data-scheme="navy"] .modalCard{background:linear-gradient(180deg,rgba(14,25,45,.96),rgba(8,18,34,.82))}
    .hamburgerBtn{position:relative}
    .hamburgerBtn .lines{display:grid;gap:4px}
    .hamburgerBtn .lines span{display:block;width:18px;height:2px;border-radius:999px;background:currentColor}
    .themeSwitch{
      min-width:118px;height:46px;padding:6px 8px 6px 10px;
      border-radius:999px;border:1px solid rgba(15,23,42,.08);
      background:rgba(255,255,255,.72);color:var(--text);
      display:inline-flex;align-items:center;gap:10px;cursor:pointer;
      transition:transform 160ms ease,border-color 160ms ease,box-shadow 160ms ease,background 160ms ease;
      font-weight:900
    }
    .themeSwitch:hover{transform:translateY(-1px);border-color:rgba(37,99,235,.18);box-shadow:0 12px 24px rgba(15,23,42,.08);background:rgba(255,255,255,.90)}
    .switchTrack{width:44px;height:24px;border-radius:999px;position:relative;background:rgba(15,23,42,.10);border:1px solid rgba(15,23,42,.08);flex:0 0 auto;transition:background 180ms ease}
    .switchThumb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(15,23,42,.16);transition:transform 180ms ease,background 180ms ease}
    body[data-scheme="navy"] .switchTrack{background:rgba(15,76,129,.62)}
    body[data-scheme="navy"] .switchThumb{transform:translateX(20px);background:#dbeafe}
    .themeLabel{font-size:.84rem;line-height:1}
    .drawerOverlay{
      position:fixed;inset:0;z-index:90;display:none;align-items:stretch;justify-content:flex-start;
      background:rgba(2,6,23,.30);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
    }
    .drawer{
      width:min(360px,calc(100vw - 24px));height:calc(100vh - 24px);margin:12px;border-radius:30px;
      padding:18px;display:flex;flex-direction:column;gap:14px;overflow:hidden
    }
    .drawerHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .drawerTitle{display:grid;gap:4px;min-width:0}
    .drawerTitle strong{font-size:1.05rem}
    .drawerTitle span{color:var(--muted);font-size:.88rem}
    .drawerList{display:grid;gap:10px;margin-top:4px;overflow:auto;padding-right:2px}
    .drawerLink{
      display:flex;align-items:center;justify-content:flex-start;gap:12px;
      padding:14px 16px;border-radius:20px;text-decoration:none;color:var(--text);
      background:rgba(255,255,255,.70);border:1px solid rgba(15,23,42,.08);
      font-weight:900;transition:transform 160ms ease,background 160ms ease,border-color 160ms ease,box-shadow 160ms ease
    }
    .drawerLink:hover{transform:translateY(-1px);background:rgba(255,255,255,.92);border-color:rgba(37,99,235,.16);box-shadow:0 12px 24px rgba(15,23,42,.08)}
    .cardTop{align-items:flex-start}
    .cardActions{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:108px;flex:0 0 auto}
    .likeBtn{
      display:inline-flex;align-items:center;gap:8px;justify-content:center;
      border:1px solid rgba(22,163,74,.18);background:rgba(34,197,94,.12);color:#15803d;
      padding:10px 12px;border-radius:999px;font-size:.86rem;font-weight:900;cursor:pointer;
      transition:transform 160ms ease,box-shadow 160ms ease,background 160ms ease,border-color 160ms ease
    }
    .likeBtn svg{color:#16a34a}
    .likeBtn:hover{transform:translateY(-1px);box-shadow:0 12px 22px rgba(22,163,74,.12);background:rgba(34,197,94,.17)}
    .likeBtn.liked{background:rgba(34,197,94,.18);border-color:rgba(22,163,74,.28)}
    .likeBtn:disabled{cursor:default;opacity:.92}
    .likeCount{font-size:.82rem;color:var(--muted);font-weight:900}
    .timeItem{white-space:nowrap}
    .actions{display:flex;align-items:center;gap:10px}
    @media (max-width:760px){
      .cardActions{min-width:0;align-items:flex-start}
      .drawer{width:calc(100vw - 24px)}
      .themeSwitch{min-width:auto;padding:6px 10px}
      .themeLabel{display:none}
    }

  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  

<script>
  const initialAppName = window.MOZLAUNCH_TITLE || "MozLaunch";
  const initialSubtitle = window.MOZLAUNCH_SUBTITLE || "by SkyeMoz";
  const fallbackManifest = { appName: initialAppName, subtitle: initialSubtitle, items: [] };
  const defaultMenuLinks = {
    tutorial: "#tutorial",
    reportBug: "#report-bug",
    requestFile: "#request-file",
    joinDiscord: "#join-discord",
    updateLogs: "#update-logs"
  };

  const state = {
    manifest: fallbackManifest,
    filter: "All",
    query: ""
  };

  const grid = document.getElementById("grid");
  const searchInput = document.getElementById("searchInput");
  const countBadge = document.getElementById("countBadge");
  const totalCount = document.getElementById("totalCount");
  const gamesCount = document.getElementById("gamesCount");
  const appsCount = document.getElementById("appsCount");
  const heroTitle = document.getElementById("heroTitle");
  const heroSubtitle = document.getElementById("heroSubtitle");
  const navTitle = document.getElementById("navTitle");
  const navSubtitle = document.getElementById("navSubtitle");
  const chips = [...document.querySelectorAll(".chip")];
  const navLinks = [...document.querySelectorAll(".navLink")];
  const logoButton = document.getElementById("logoButton");
  const modal = document.getElementById("modal");
  const modalTitle = document.getElementById("modalTitle");
  const modalSub = document.getElementById("modalSub");
  const stageLabel = document.getElementById("stageLabel");
  const stagePct = document.getElementById("stagePct");
  const modalBar = document.getElementById("modalBar");
  const closeModal = document.getElementById("closeModal");
  const menuBtn = document.getElementById("menuBtn");
  const drawerOverlay = document.getElementById("drawerOverlay");
  const closeDrawer = document.getElementById("closeDrawer");
  const drawerList = document.getElementById("drawerList");
  const schemeSwitch = document.getElementById("schemeSwitch");
  const schemeLabel = document.getElementById("schemeLabel");

  const firebaseConfig = window.firebaseConfig || window.MOZLAUNCH_FIREBASE_CONFIG || null;
  const firebaseCollection = window.MOZLAUNCH_COLLECTION || "items";
  let db = null;
  let unsubscribeItems = null;
  let activeLaunch = null;
  let rafId = 0;
  let backgroundSeed = Math.random();

  function esc(v){ return String(v ?? "").replace(/[<>]/g, ""); }
  function safeSlug(v){ return String(v ?? "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "item"; }

  function toDate(value){
    if(!value) return null;
    if(typeof value?.toDate === "function") return value.toDate();
    if(typeof value?.seconds === "number") return new Date(value.seconds * 1000);
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function formatRelativeTime(value){
    const d = toDate(value);
    if(!d) return "just now";
    const diff = Math.max(0, Date.now() - d.getTime());
    const sec = Math.floor(diff / 1000);
    if(sec < 1) return "1s ago";
    if(sec < 60) return `${sec}s ago`;
    const min = Math.floor(sec / 60);
    if(min < 60) return `${min}m ago`;
    const hr = Math.floor(min / 60);
    if(hr < 24) return `${hr}h ago`;
    const day = Math.floor(hr / 24);
    if(day < 365) return `${day}d ago`;
    const yr = Math.floor(day / 365);
    return `${yr}y ago`;
  }

  function iconSvg(n){
    const i = {
      note:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.5h7l3.5 3.5V20a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3.5V7h3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11h8M8 14h8M8 17h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
      gamepad:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10h10a4 4 0 0 1 4 4v.5A3.5 3.5 0 0 1 17.5 18H6.5A3.5 3.5 0 0 1 3 14.5V14a4 4 0 0 1 4-4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.5 13.2h3M10 11.7v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.2 12.6h.01M18 14h.01" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>`,
      spark:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l1.78 5.45L19.5 10.2l-4.18 3.04L16.96 19 12 15.8 7.04 19l1.64-5.76L4.5 10.2l5.72-1.75L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>`,
      car:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.3 10.2 7.7 7.4A2 2 0 0 1 9.48 6.3h5.04a2 2 0 0 1 1.78 1.1l1.4 2.8M5 14h14v3a1 1 0 0 1-1 1h-.7a1.3 1.3 0 0 1-1.3-1.3V16H8v.7A1.3 1.3 0 0 1 6.7 18H6a1 1 0 0 1-1-1v-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7 14.2h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8.5" cy="15.9" r="1" stroke="currentColor" stroke-width="1.5"/><circle cx="15.5" cy="15.9" r="1" stroke="currentColor" stroke-width="1.5"/></svg>`,
      tools:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 4.5a4.5 4.5 0 0 0-4.08 6.4L4.6 16.7a1.8 1.8 0 1 0 2.55 2.55l5.8-5.82a4.5 4.5 0 1 0 1.55-8.93Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.3 7.2l1.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
      moon:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.5 3.5a7.5 7.5 0 1 0 5 13.1 8 8 0 1 1-5-13.1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>`,
      like:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10v10H4V10h3Zm2 10c2.8 0 9.2 0 11-1.8 1.1-1.1 1-2.8.4-3.6.6-.6 1-1.4 1-2.3 0-1-.5-1.9-1.3-2.4.1-.4.2-.8.2-1.2 0-2-1.7-3.7-3.7-3.7h-5.2l.5-2.1c.1-.5 0-1.1-.3-1.5L10.8 2 6 8.1V20h3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
      clock:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5v5l3 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    };
    return i[n] || i.spark;
  }

  function appPreview(item){ return item.thumbnail ? `<img src="${esc(item.thumbnail)}" alt="${esc(item.title)} thumbnail" loading="lazy" />` : `<div class="appIconFallback">${iconSvg(item.icon)}</div>`; }
  function normalize(item){
    const uploadValue = item.uploadedAt ?? item.createdAt ?? item.date ?? item.time ?? null;
    return {
      id: item.id || item.docId || safeSlug(item.title),
      title: item.title || "Untitled",
      description: item.description || "",
      type: item.type || "Apps",
      tag: item.tag || item.type || "Item",
      size: item.size || "",
      launch: item.launch || item.link || item.url || "#",
      thumbnail: item.thumbnail || "",
      icon: item.icon || "spark",
      likes: Number(item.likes || 0),
      uploadedAt: uploadValue,
      rawDate: item.date || uploadValue
    };
  }

  function currentItems(){
    const q = state.query.trim().toLowerCase();
    return (state.manifest?.items || []).filter(item => {
      const typeOk = state.filter === "All" || esc(item.type) === state.filter;
      const queryOk = !q || [item.title, item.description, item.type, item.tag, item.size, item.likes, formatRelativeTime(item.uploadedAt), item.launch]
        .join(" ")
        .toLowerCase()
        .includes(q);
      return typeOk && queryOk;
    });
  }

  function updateStats(items){
    const total = state.manifest?.items?.length || 0;
    const games = (state.manifest?.items || []).filter(i => esc(i.type) === "Games").length;
    const apps = (state.manifest?.items || []).filter(i => esc(i.type) === "Apps").length;
    totalCount.textContent = total;
    gamesCount.textContent = games;
    appsCount.textContent = apps;
    countBadge.textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;
  }

  function likeKeyFor(item){
    return `mozlaunch_like_${item.id || safeSlug(item.title)}`;
  }

  function isLiked(item){
    try { return localStorage.getItem(likeKeyFor(item)) === "1"; }
    catch { return false; }
  }

  async function incrementLike(item){
    if(isLiked(item)) return;
    try { localStorage.setItem(likeKeyFor(item), "1"); } catch {}
    if(db && item.id){
      try{
        await db.collection(firebaseCollection).doc(item.id).set({
          likes: firebase.firestore.FieldValue.increment(1)
        }, { merge: true });
        return;
      } catch (err) {
        console.warn("Like update failed, using local fallback:", err);
      }
    }
    item.likes = (Number(item.likes || 0) + 1);
    render();
  }

  function render(){
    const items = currentItems();
    updateStats(items);
    grid.innerHTML = "";
    if(!items.length){
      grid.innerHTML = `<div class="empty">No matching items found. Connect Firebase or add entries in <code>settings/manifest.json</code>.</div>`;
      return;
    }

    items.forEach((item, index) => {
      const liked = isLiked(item);
      const uploaded = formatRelativeTime(item.uploadedAt || item.rawDate || item.date);
      const card = document.createElement("article");
      card.className = "card";
      card.style.animationDelay = `${index * 55}ms`;
      card.innerHTML = `
        <div class="cardGlow"></div>
        <div class="cardTop">
          <div class="appInfo">
            <div class="appThumb" aria-hidden="true">${appPreview(item)}</div>
            <div class="appText">
              <div class="titleRow">
                <h2>${esc(item.title)}</h2>
                <span class="tag">${esc(item.tag || item.type || "Item")}</span>
              </div>
              <p class="desc">${esc(item.description)}</p>
            </div>
          </div>
          <div class="cardActions">
            <button class="likeBtn ${liked ? "liked" : ""}" type="button" aria-pressed="${liked ? "true" : "false"}" ${liked ? "disabled" : ""}>
              ${iconSvg("like")}
              <span>${liked ? "Liked" : "Like"}</span>
            </button>
            <span class="likeCount"><span class="likeTotal">${Number(item.likes || 0)}</span> likes</span>
          </div>
        </div>
        <div class="meta">
          <span class="metaItem timeItem">${iconSvg("clock")} Uploaded ${uploaded}</span>
          <span class="metaItem"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 12h12M6 8h7M6 16h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>${esc(item.size || "")}</span>
        </div>
        <div class="progress" aria-hidden="true">
          <div class="progressTop"><span class="pStage">Ready</span><span class="pPct">0%</span></div>
          <div class="bar"><span></span></div>
        </div>
        <div class="actions"><button class="launchBtn" type="button">Launch</button></div>
      `;

      const btn = card.querySelector(".launchBtn");
      const likeBtn = card.querySelector(".likeBtn");
      const progress = card.querySelector(".progress");
      const pStage = card.querySelector(".pStage");
      const pPct = card.querySelector(".pPct");
      const bar = card.querySelector(".bar > span");
      const likeTotal = card.querySelector(".likeTotal");
      const stages = ["Loading package", "Optimizing assets", "Building session", "Opening link"];

      card.addEventListener("click", (e) => {
        if(e.target.closest(".likeBtn") || e.target.closest(".launchBtn")) return;
        startLaunch({
          title: esc(item.title),
          sub: esc(item.description),
          progress,
          pStage,
          pPct,
          bar,
          button: btn,
          stages,
          link: item.launch
        });
      });

      likeBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if(likeBtn.disabled) return;
        likeBtn.disabled = true;
        item.likes = Number(item.likes || 0) + 1;
        likeBtn.classList.add("liked");
        likeBtn.setAttribute("aria-pressed", "true");
        likeBtn.querySelector("span").textContent = "Liked";
        if(likeTotal) likeTotal.textContent = String(item.likes);
        await incrementLike(item);
      });

      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        startLaunch({
          title: esc(item.title),
          sub: esc(item.description),
          progress,
          pStage,
          pPct,
          bar,
          button: btn,
          stages,
          link: item.launch
        });
      });

      grid.appendChild(card);
    });
  }

  function setFilter(filter){
    state.filter = filter;
    chips.forEach(c => c.classList.toggle("active", c.dataset.filter === filter));
    render();
    highlightNav(filter === "All" ? "all" : filter.toLowerCase());
  }

  chips.forEach(chip => chip.addEventListener("click", () => setFilter(chip.dataset.filter)));
  searchInput.addEventListener("input", () => {
    state.query = searchInput.value;
    render();
  });

  function openModal(title, sub){
    modalTitle.textContent = title || "Launching";
    modalSub.textContent = sub || "Preparing launch";
    modal.style.display = "grid";
    modal.setAttribute("aria-hidden", "false");
  }

  function closeLaunchModal(){
    modal.style.display = "none";
    modal.setAttribute("aria-hidden", "true");
  }

  closeModal.addEventListener("click", () => {
    if(activeLaunch?.button) activeLaunch.button.disabled = false;
    activeLaunch = null;
    closeLaunchModal();
  });

  modal.addEventListener("click", e => {
    if(e.target === modal){
      if(activeLaunch?.button) activeLaunch.button.disabled = false;
      activeLaunch = null;
      closeLaunchModal();
    }
  });

  logoButton.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
    highlightNav("top");
  });

  logoButton.addEventListener("keydown", e => {
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
      highlightNav("top");
    }
  });

  function goToLink(link){
    const safeLink = String(link || "").trim();
    if(!safeLink || safeLink === "#") return;
    if(safeLink.startsWith("#")){
      const el = document.querySelector(safeLink);
      if(el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      history.replaceState(null, "", safeLink);
      return;
    }
    if(safeLink.startsWith("./") || safeLink.startsWith("../") || safeLink.startsWith("/")){
      window.location.href = safeLink;
      return;
    }
    try { window.location.href = new URL(safeLink, window.location.href).href; }
    catch { window.location.href = safeLink; }
  }

  function startLaunch(ctx){
    if(activeLaunch) return;
    activeLaunch = ctx;
    ctx.button.disabled = true;
    ctx.progress.classList.add("active");
    ctx.progress.setAttribute("aria-hidden", "false");
    openModal(ctx.title, ctx.sub);

    const duration = 1800 + Math.floor(Math.random() * 1800);
    const start = performance.now();
    const totalStages = ctx.stages.length;
    cancelAnimationFrame(rafId);

    const tick = () => {
      const elapsed = performance.now() - start;
      const progress = Math.min(100, Math.round((elapsed / duration) * 100));
      const stageIndex = Math.min(totalStages - 1, Math.floor(progress / (100 / totalStages)));

      ctx.bar.style.width = `${progress}%`;
      ctx.pPct.textContent = `${progress}%`;
      ctx.pStage.textContent = ctx.stages[stageIndex];
      stageLabel.textContent = ctx.stages[stageIndex];
      stagePct.textContent = `${progress}%`;
      modalBar.style.width = `${progress}%`;

      if(progress < 100){
        rafId = requestAnimationFrame(tick);
        return;
      }

      ctx.pStage.textContent = "Teleported";
      stageLabel.textContent = "Teleported";
      stagePct.textContent = "100%";

      setTimeout(() => {
        ctx.progress.classList.remove("active");
        ctx.progress.setAttribute("aria-hidden", "true");
        ctx.bar.style.width = "0%";
        ctx.pPct.textContent = "0%";
        ctx.pStage.textContent = "Ready";
        modalBar.style.width = "0%";
        ctx.button.disabled = false;
        activeLaunch = null;
        closeLaunchModal();
        goToLink(ctx.link);
      }, 260);
    };

    rafId = requestAnimationFrame(tick);
  }

  function highlightNav(target){
    navLinks.forEach(link => link.classList.toggle("active", link.dataset.nav === target));
  }

  navLinks.forEach(link => {
    link.addEventListener("click", e => {
      const target = link.getAttribute("href");
      if(!target || !target.startsWith("#")) return;
      const el = document.querySelector(target);
      if(el){
        e.preventDefault();
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        history.replaceState(null, "", target);
        highlightNav(link.dataset.nav);
      }
    });
  });

  function setScheme(scheme){
    const value = scheme === "navy" ? "navy" : "light";
    document.body.dataset.scheme = value;
    schemeLabel.textContent = value === "navy" ? "NavyBlue" : "Light";
    try { localStorage.setItem("mozlaunch_scheme", value); } catch {}
  }

  schemeSwitch.addEventListener("click", () => {
    setScheme(document.body.dataset.scheme === "navy" ? "light" : "navy");
  });

  function openDrawer(){
    drawerOverlay.style.display = "flex";
    drawerOverlay.setAttribute("aria-hidden", "false");
  }

  function closeDrawerMenu(){
    drawerOverlay.style.display = "none";
    drawerOverlay.setAttribute("aria-hidden", "true");
  }

  menuBtn.addEventListener("click", openDrawer);
  closeDrawer.addEventListener("click", closeDrawerMenu);
  drawerOverlay.addEventListener("click", e => {
    if(e.target === drawerOverlay) closeDrawerMenu();
  });

  drawerList.addEventListener("click", e => {
    const link = e.target.closest(".drawerLink");
    if(!link) return;
    e.preventDefault();
    const key = link.dataset.link;
    closeDrawerMenu();
    goToLink((window.MOZLAUNCH_MENU_LINKS && window.MOZLAUNCH_MENU_LINKS[key]) || defaultMenuLinks[key] || "#");
  });

  function normalizeItemData(raw, id){
    const normalized = normalize({ id, ...raw });
    return normalized;
  }

  function applyManifest(data){
    const items = Array.isArray(data?.items) ? data.items.map((item, index) => normalizeItemData(item, item.id || item.docId || `item-${index}`)) : [];
    state.manifest = {
      appName: data?.appName || initialAppName,
      subtitle: data?.subtitle || initialSubtitle,
      items
    };
    heroTitle.textContent = esc(state.manifest.appName);
    heroSubtitle.textContent = esc(state.manifest.subtitle);
    navTitle.textContent = esc(state.manifest.appName);
    navSubtitle.textContent = esc(state.manifest.subtitle);
    render();
  }

  async function loadManifestJson(){
    try{
      const res = await fetch("./settings/manifest.json", { cache: "no-store" });
      if(!res.ok) throw new Error("manifest not found");
      const data = await res.json();
      applyManifest(data);
      return true;
    }catch(err){
      state.manifest = fallbackManifest;
      heroTitle.textContent = esc(initialAppName);
      heroSubtitle.textContent = esc(initialSubtitle);
      navTitle.textContent = esc(initialAppName);
      navSubtitle.textContent = esc(initialSubtitle);
      render();
      return false;
    }
  }

  function initFirebase(){
    if(!firebaseConfig || !firebaseConfig.apiKey || typeof window.firebase === "undefined") return false;
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    return true;
  }

  async function loadFirebaseItems(){
    if(!initFirebase()) return false;
    try{
      if(unsubscribeItems) unsubscribeItems();
      const collection = db.collection(firebaseCollection);
      unsubscribeItems = collection.onSnapshot(snapshot => {
        const docs = snapshot.docs
          .map(doc => normalizeItemData(doc.data() || {}, doc.id))
          .sort((a, b) => {
            const at = toDate(b.uploadedAt || b.rawDate)?.getTime() || 0;
            const bt = toDate(a.uploadedAt || a.rawDate)?.getTime() || 0;
            return at - bt;
          });

        state.manifest = {
          appName: initialAppName,
          subtitle: initialSubtitle,
          items: docs
        };
        heroTitle.textContent = esc(initialAppName);
        heroSubtitle.textContent = esc(initialSubtitle);
        navTitle.textContent = esc(initialAppName);
        navSubtitle.textContent = esc(initialSubtitle);
        render();
      }, async () => {
        await loadManifestJson();
      });
      return true;
    }catch(err){
      console.warn("Firebase load failed, falling back to manifest.json", err);
      return await loadManifestJson();
    }
  }

  async function loadData(){
    const loadedFirebase = await loadFirebaseItems();
    if(!loadedFirebase) await loadManifestJson();
  }

  async function refreshMotion(){
    backgroundSeed = Math.random();
  }

  document.addEventListener("contextmenu", e => e.preventDefault());

  function initBackground(){
    const bg = document.getElementById("bgCanvas"), fx = document.getElementById("fxCanvas");
    const bctx = bg.getContext("2d"), fctx = fx.getContext("2d");
    let w = 0, h = 0, t = 0;
    const bubbles = Array.from({ length: 56 }, () => ({ x: Math.random(), y: Math.random(), r:.9 + Math.random() * 2, a:.08 + Math.random() * .18, vx:(Math.random()-.5)*.00024, vy:(Math.random()-.5)*.00024 }));
    const particles = Array.from({ length: 72 }, () => ({ x: Math.random(), y: Math.random(), vx:(Math.random()-.5)*.00072, vy:(Math.random()-.5)*.00072, r:1 + Math.random()*2.1 }));

    function resize(){
      w = bg.width = fx.width = Math.floor(window.innerWidth * devicePixelRatio);
      h = bg.height = fx.height = Math.floor(window.innerHeight * devicePixelRatio);
      bg.style.width = fx.style.width = window.innerWidth + "px";
      bg.style.height = fx.style.height = window.innerHeight + "px";
    }
    window.addEventListener("resize", resize, { passive:true });
    resize();

    function draw(){
      t += .0025;
      bctx.clearRect(0,0,w,h);
      fctx.clearRect(0,0,w,h);

      const g = bctx.createLinearGradient(0,0,w,h);
      g.addColorStop(0, `rgba(37,99,235,${.05 + Math.sin(t + backgroundSeed) * .01})`);
      g.addColorStop(.5, `rgba(255,255,255,${.12 + Math.cos(t * 1.1) * .02})`);
      g.addColorStop(1, `rgba(139,92,246,${.05 + Math.sin(t * .8 + 1) * .01})`);
      bctx.fillStyle = g;
      bctx.fillRect(0,0,w,h);

      for(const s of bubbles){
        s.x += s.vx; s.y += s.vy;
        if(s.x < -.05) s.x = 1.05;
        if(s.x > 1.05) s.x = -.05;
        if(s.y < -.05) s.y = 1.05;
        if(s.y > 1.05) s.y = -.05;
        bctx.beginPath();
        bctx.fillStyle = `rgba(37,99,235,${s.a})`;
        bctx.arc(s.x*w, s.y*h, s.r*devicePixelRatio, 0, Math.PI*2);
        bctx.fill();
      }

      for(let i=0;i<particles.length;i++){
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if(p.x < -.1) p.x = 1.1;
        if(p.x > 1.1) p.x = -.1;
        if(p.y < -.1) p.y = 1.1;
        if(p.y > 1.1) p.y = -.1;
        const x = p.x*w, y = p.y*h;
        fctx.beginPath();
        fctx.fillStyle = "rgba(37,99,235,.40)";
        fctx.arc(x,y,p.r*devicePixelRatio,0,Math.PI*2);
        fctx.fill();
        for(let j=i+1;j<particles.length;j++){
          const q = particles[j];
          const dx = (p.x-q.x)*w, dy = (p.y-q.y)*h, dist = Math.hypot(dx,dy), maxDist = 170*devicePixelRatio;
          if(dist < maxDist){
            fctx.beginPath();
            fctx.strokeStyle = `rgba(37,99,235,${.08*(1-dist/maxDist)})`;
            fctx.lineWidth = 1;
            fctx.moveTo(x,y);
            fctx.lineTo(q.x*w,q.y*h);
            fctx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }
    draw();
  }

  const savedScheme = (() => {
    try { return localStorage.getItem("mozlaunch_scheme") || "light"; }
    catch { return "light"; }
  })();
  setScheme(savedScheme === "navy" ? "navy" : "light");

  loadData();
  initBackground();
</script>
