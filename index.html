<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07142c" />
  <title>MozLaunch</title>
  <style>
    :root{
      --bg0:#050b18;
      --bg1:#081225;
      --bg2:#0c1b36;
      --bg3:#11264a;
      --glass:rgba(10,18,36,.62);
      --glass-strong:rgba(15,25,48,.82);
      --line:rgba(147,197,253,.12);
      --line-strong:rgba(96,165,250,.18);
      --text:#eaf2ff;
      --muted:#9fb3d1;
      --muted-2:#7f94b8;
      --accent:#2f6bff;
      --accent-2:#5b8cff;
      --accent-3:#7c5cff;
      --success:#22c55e;
      --shadow:0 24px 80px rgba(1,6,17,.42);
      --shadow-soft:0 14px 40px rgba(1,6,17,.28);
      --nav-h:76px;
      --radius-xl:34px;
      --radius-lg:28px;
      --radius-md:20px;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;
      min-height:100%;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 14%,rgba(47,107,255,.20),transparent 24%),
        radial-gradient(circle at 86% 6%,rgba(124,92,255,.18),transparent 22%),
        radial-gradient(circle at 56% 102%,rgba(34,197,94,.08),transparent 22%),
        linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 38%,var(--bg2) 72%,var(--bg3) 100%);
      overflow-x:hidden;
      user-select:none;
      -webkit-user-select:none;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(120deg,rgba(255,255,255,.06),transparent 26%,rgba(255,255,255,.02)),
        radial-gradient(circle at 50% 0%,rgba(255,255,255,.08),transparent 34%);
      z-index:0;
    }

    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
    #bgCanvas{z-index:0}
    #fxCanvas{z-index:1}

    .app{position:relative;z-index:2;min-height:100vh;padding:20px}
    .wrap{width:min(1360px,100%);margin:0 auto;display:grid;gap:16px;padding-top:calc(var(--nav-h) + 10px)}
    .glass{
      background:linear-gradient(180deg,var(--glass-strong),var(--glass));
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      backdrop-filter:blur(30px) saturate(170%);
      -webkit-backdrop-filter:blur(30px) saturate(170%);
    }

    .nav{
      position:fixed;
      top:16px;
      left:50%;
      transform:translateX(-50%);
      width:min(1360px,calc(100% - 24px));
      height:var(--nav-h);
      border-radius:999px;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:12px 14px 12px 16px;
      background:linear-gradient(180deg,rgba(11,19,38,.90),rgba(10,18,36,.70));
      border:1px solid rgba(147,197,253,.10);
      box-shadow:0 18px 54px rgba(0,0,0,.32);
    }

    .brand{
      display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;padding:6px 10px 6px 6px;border-radius:999px;
      transition:transform 160ms ease,background 160ms ease,box-shadow 160ms ease,border-color 160ms ease;
    }
    .brand:hover{transform:translateY(-1px);background:rgba(255,255,255,.05);box-shadow:0 10px 24px rgba(0,0,0,.18);border-color:rgba(147,197,253,.10)}
    .brandMark{
      width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:0 0 auto;
      background:linear-gradient(135deg,rgba(47,107,255,1),rgba(124,92,255,1));
      box-shadow:0 18px 28px rgba(47,107,255,.22);
    }
    .brandText{min-width:0;display:grid;gap:2px}
    .brandText strong{font-size:1rem;line-height:1.1;letter-spacing:.2px}
    .brandText span{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}

    .navCenter{display:flex;align-items:center;gap:10px;flex:1;justify-content:center;min-width:0}
    .navLink{
      display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--muted);
      font-weight:800;font-size:.92rem;padding:10px 14px;border-radius:999px;cursor:pointer;
      transition:transform 160ms ease,background 160ms ease,color 160ms ease,border-color 160ms ease,box-shadow 160ms ease;text-decoration:none;white-space:nowrap;
    }
    .navLink:hover,.navLink.active{
      color:var(--text);background:rgba(255,255,255,.08);border-color:rgba(96,165,250,.18);box-shadow:0 10px 24px rgba(0,0,0,.18);transform:translateY(-1px)
    }

    .hero{border-radius:36px;padding:22px;animation:rise .7s ease both;position:relative;overflow:hidden}
    .hero::after{
      content:"";position:absolute;inset:auto -10% -38% auto;width:420px;height:420px;border-radius:50%;
      background:radial-gradient(circle,rgba(47,107,255,.16),transparent 72%);filter:blur(10px);pointer-events:none;
    }
    .heroTop{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:stretch;position:relative;z-index:1}
    .heroCopy{display:grid;gap:14px;align-content:start;min-width:0}
    .heroBadgeRow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .badge{
      display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 14px;font-size:.88rem;font-weight:800;
      border:1px solid rgba(96,165,250,.16);background:rgba(255,255,255,.06);color:var(--text);box-shadow:0 10px 20px rgba(0,0,0,.12)
    }
    .hero h1{margin:0;font-size:clamp(2rem,4vw,4rem);line-height:1;letter-spacing:-.04em}
    .hero p{margin:0;max-width:62ch;color:var(--muted);line-height:1.6;font-size:1rem}

    .heroStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .statCard{
      border-radius:24px;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.035));
      border:1px solid rgba(147,197,253,.10);box-shadow:var(--shadow-soft);min-height:106px;display:grid;align-content:space-between;gap:12px;
    }
    .statIcon{
      width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(47,107,255,.12);border:1px solid rgba(96,165,250,.16)
    }
    .statCard strong{display:block;font-size:1.2rem;line-height:1.1;margin-top:2px}
    .statCard span{font-size:.88rem;color:var(--muted)}

    .toolbar{border-radius:28px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;animation:rise .78s ease both}
    .search{position:relative;min-width:0}
    .search input{
      width:100%;border:1px solid rgba(147,197,253,.12);background:rgba(255,255,255,.05);color:var(--text);
      padding:16px 16px 16px 50px;border-radius:18px;outline:none;font-size:1rem;
      transition:border-color 160ms ease,box-shadow 160ms ease,transform 160ms ease,background 160ms ease;user-select:text;-webkit-user-select:text;
    }
    .search input::placeholder{color:rgba(159,179,209,.72)}
    .search input:focus{border-color:rgba(96,165,250,.28);box-shadow:0 0 0 4px rgba(47,107,255,.12);transform:translateY(-1px);background:rgba(255,255,255,.08)}
    .searchIcon{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.8;pointer-events:none}

    .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .chip{
      border:1px solid rgba(147,197,253,.12);background:rgba(255,255,255,.05);color:var(--muted);padding:11px 14px;
      border-radius:999px;font-size:.9rem;font-weight:800;cursor:pointer;transition:transform 160ms ease,background 160ms ease,color 160ms ease,border-color 160ms ease,box-shadow 160ms ease;display:inline-flex;align-items:center;gap:8px
    }
    .chip:hover,.chip.active{transform:translateY(-1px);color:var(--text);background:rgba(255,255,255,.09);border-color:rgba(96,165,250,.20);box-shadow:0 12px 24px rgba(0,0,0,.18)}
    .count{white-space:nowrap;color:var(--muted);font-weight:800;padding:11px 14px;border-radius:999px;border:1px solid rgba(147,197,253,.12);background:rgba(255,255,255,.05)}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding-bottom:8px}
    .card{
      position:relative;overflow:hidden;border-radius:30px;border:1px solid rgba(147,197,253,.10);
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.045));
      backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
      box-shadow:var(--shadow-soft);padding:18px;opacity:0;transform:translateY(18px) scale(.985);animation:cardIn .72s ease forwards;
      transition:transform 180ms ease,border-color 180ms ease,box-shadow 180ms ease,background 180ms ease;min-height:352px;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:14px;
      --card-accent: var(--accent);
      --card-accent-2: var(--accent-3);
      --card-soft: rgba(47,107,255,.10);
    }
    .card::before{
      content:"";position:absolute;inset:0;background:
        radial-gradient(circle at 90% 12%, color-mix(in srgb, var(--card-accent) 28%, transparent), transparent 26%),
        radial-gradient(circle at 0% 100%, color-mix(in srgb, var(--card-accent-2) 18%, transparent), transparent 28%);
      pointer-events:none;opacity:.95;
    }
    .card::after{
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:linear-gradient(135deg,color-mix(in srgb, var(--card-accent) 40%, transparent),transparent 26%,transparent 74%,color-mix(in srgb, var(--card-accent-2) 26%, transparent));
      opacity:.45;
      mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
      -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
      padding:1px;
    }
    .card:hover{transform:translateY(-5px) scale(1);border-color:rgba(96,165,250,.24);box-shadow:0 26px 58px rgba(0,0,0,.30)}
    .cardGlow{position:absolute;inset:auto -20% -34% auto;width:260px;height:260px;background:radial-gradient(circle,color-mix(in srgb, var(--card-accent) 18%, transparent),transparent 72%);pointer-events:none;filter:blur(10px)}
    .cardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1}
    .appInfo{display:flex;gap:14px;min-width:0;flex:1}
    .appThumb{
      width:74px;height:74px;border-radius:22px;overflow:hidden;flex:0 0 auto;background:linear-gradient(135deg,var(--card-soft),rgba(255,255,255,.04));
      border:1px solid rgba(147,197,253,.10);box-shadow:0 14px 24px rgba(0,0,0,.14);display:grid;place-items:center;color:var(--text)
    }
    .appThumb img{width:100%;height:100%;object-fit:cover;display:block}
    .appIconFallback{color:currentColor}
    .appText{min-width:0;flex:1;display:grid;gap:7px}
    .titleRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .titleRow h2{margin:0;font-size:1.06rem;line-height:1.15;letter-spacing:-.02em}
    .tag{
      display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:.76rem;font-weight:900;letter-spacing:.2px;
      color:color-mix(in srgb, var(--card-accent) 70%, white);
      border:1px solid color-mix(in srgb, var(--card-accent) 24%, transparent);
      background:color-mix(in srgb, var(--card-accent) 12%, transparent);
    }
    .desc{margin:0;color:var(--muted);line-height:1.56;font-size:.96rem;min-height:3.1lh;position:relative;z-index:1}
    .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#d7e4fa;font-size:.88rem;font-weight:700;padding-top:2px;position:relative;z-index:1}
    .metaItem{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(147,197,253,.08)}
    .launchBtn{
      width:100%;border:0;border-radius:18px;padding:13px 16px;color:#fff;cursor:pointer;font-weight:900;font-size:.98rem;
      background:linear-gradient(135deg,var(--card-accent),var(--card-accent-2));box-shadow:0 16px 28px color-mix(in srgb, var(--card-accent) 24%, transparent);
      transition:transform 160ms ease,filter 160ms ease,box-shadow 160ms ease,opacity 160ms ease;position:relative;z-index:1;
    }
    .launchBtn:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 18px 32px rgba(0,0,0,.22)}
    .launchBtn:disabled{opacity:.82;cursor:wait;transform:none}
    .progress{display:none;gap:10px;padding-top:2px;position:relative;z-index:1}
    .progress.active{display:grid}
    .progressTop{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#d7e4fa;font-size:.87rem;font-weight:800}
    .bar{height:11px;border-radius:999px;overflow:hidden;border:1px solid rgba(147,197,253,.12);background:rgba(255,255,255,.06)}
    .bar>span{display:block;height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,var(--card-accent),var(--accent-2),var(--card-accent-2));transition:width 120ms linear}
    .empty{
      grid-column:1 / -1;padding:40px 20px;text-align:center;color:var(--muted);border-radius:28px;border:1px dashed rgba(147,197,253,.20);
      background:rgba(255,255,255,.04);backdrop-filter:blur(18px)
    }
    .footer{color:rgba(234,242,255,.42);font-size:.84rem;text-align:center;padding:2px 0 10px}
    .srOnly{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    ::selection{background:rgba(47,107,255,.24);color:#f7fbff}
    ::-moz-selection{background:rgba(47,107,255,.24);color:#f7fbff}
    img,a,button,input,textarea{-webkit-user-drag:none}
    svg{display:block;flex:0 0 auto}
    @keyframes rise{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:1060px){
      .heroTop{grid-template-columns:1fr}
      .heroStats{grid-template-columns:repeat(3,1fr)}
      .navCenter{display:none}
      .nav{justify-content:space-between}
    }
    @media (max-width:760px){
      .app{padding:12px}
      .nav{width:calc(100% - 16px);height:68px;padding:10px 12px;top:8px}
      .brandText span{max-width:20ch}
      .wrap{padding-top:calc(68px + 10px)}
      .hero,.toolbar{border-radius:26px}
      .heroStats{grid-template-columns:1fr}
      .toolbar{grid-template-columns:1fr}
      .controls{justify-content:flex-start}
      .count{justify-self:start}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <canvas id="fxCanvas"></canvas>

  <header class="nav glass">
    <div class="brand" id="logoButton" role="button" tabindex="0" aria-label="Go to top">
      <div class="brandMark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 10-13h-6l0-7Z" stroke="white" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </div>
      <div class="brandText">
        <strong id="navTitle">MozLaunch</strong>
        <span id="navSubtitle">by SkyeMoz</span>
      </div>
    </div>

    <nav class="navCenter" aria-label="Primary">
      <a class="navLink active" href="#top" data-nav="top">Home</a>
      <a class="navLink" href="#apps" data-nav="apps">Apps</a>
      <a class="navLink" href="#games" data-nav="games">Games</a>
      <a class="navLink" href="#files" data-nav="files">File</a>
      <a class="navLink" href="#all" data-nav="all">All Items</a>
    </nav>

    <div class="navRight"></div>
  </header>

  <main class="app" id="top">
    <div class="wrap">
      <section class="hero glass">
        <div class="heroTop">
          <div class="heroCopy">
            <div class="heroBadgeRow">
              <span class="badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2l2.7 5.48L20.7 8.3l-4.35 4.24L17.37 19 12 16.18 6.63 19l1.02-6.46L3.3 8.3l6-0.82L12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                🟢 Active
              </span>
              <span class="badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.5 7.5l9 9M16.5 7.5l-9 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                v26.0
              </span>
            </div>
            <h1 id="heroTitle">MozLaunch</h1>
            <p id="heroSubtitle">by SkyeMoz</p>
          </div>

          <div class="heroStats" aria-label="Dashboard stats">
            <div class="statCard">
              <div class="statIcon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 8.5h16M4 12h16M4 15.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
              <div><strong id="totalCount">0</strong><span>Total items</span></div>
            </div>
            <div class="statCard">
              <div class="statIcon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7 7h10l-1 11H8L7 7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 7a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
              <div><strong id="gamesCount">0</strong><span>Game items</span></div>
            </div>
            <div class="statCard">
              <div class="statIcon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 7.5h12v10H6v-10Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 9h6M9 12h6M9 15h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
              <div><strong id="appsCount">0</strong><span>App items</span></div>
            </div>
          </div>
        </div>
      </section>

      <section class="toolbar glass" id="all">
        <div class="search">
          <svg class="searchIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="rgba(234,242,255,.78)" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="rgba(234,242,255,.78)" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="text" placeholder="Search titles, tags, sizes, or descriptions" autocomplete="off" />
        </div>
        <div class="controls" aria-label="Filters">
          <button class="chip active" data-filter="All" type="button">All</button>
          <button class="chip" data-filter="Games" type="button">Games</button>
          <button class="chip" data-filter="Apps" type="button">Apps</button>
          <button class="chip" data-filter="File" type="button">File</button>
          <div class="count" id="countBadge">0 items</div>
        </div>
      </section>

      <section id="apps" class="srOnly" aria-hidden="true"></section>
      <section id="games" class="srOnly" aria-hidden="true"></section>
      <section id="files" class="srOnly" aria-hidden="true"></section>
      <section id="grid" class="grid" aria-live="polite"></section>
      <div class="footer"></div>
    </div>
  </main>

  <div id="modal" class="overlay" aria-hidden="true" style="position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(4,10,22,.64);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:80;">
    <div class="modalCard" style="width:min(560px,100%);border-radius:32px;border:1px solid rgba(147,197,253,.12);background:linear-gradient(180deg,rgba(12,20,40,.96),rgba(8,14,28,.90));box-shadow:0 30px 90px rgba(0,0,0,.40);padding:22px;animation:pop .22s ease both;">
      <div class="modalTop" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;">
        <div>
          <h3 class="modalTitle" id="modalTitle" style="margin:0;font-size:1.14rem;line-height:1.2;letter-spacing:-.02em;">Launching</h3>
          <p class="modalSub" id="modalSub" style="margin:6px 0 0;color:var(--muted);line-height:1.5;font-size:.95rem;">Preparing launch</p>
        </div>
        <button class="close" id="closeModal" type="button" aria-label="Close" style="width:42px;height:42px;border-radius:14px;border:1px solid rgba(147,197,253,.12);background:rgba(255,255,255,.06);color:var(--text);font-size:20px;cursor:pointer;">×</button>
      </div>
      <div class="spinnerRow" style="display:flex;justify-content:center;padding:10px 0 2px;"><div class="spinner" aria-hidden="true" style="width:52px;height:52px;border-radius:50%;border:4px solid rgba(47,107,255,.16);border-top-color:rgba(47,107,255,.96);border-right-color:rgba(124,92,255,.92);animation:spin .9s linear infinite;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)"></div></div>
      <div class="loaderWrap" style="display:grid;gap:12px;margin-top:12px;">
        <div class="loaderLine" style="display:flex;justify-content:space-between;gap:12px;align-items:center;color:#d7e4fa;font-size:.92rem;font-weight:800;"><span id="stageLabel">Loading resources</span><span id="stagePct">0%</span></div>
        <div class="bar" style="height:11px;border-radius:999px;overflow:hidden;border:1px solid rgba(147,197,253,.12);background:rgba(255,255,255,.06)"><span id="modalBar" style="display:block;height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent-3));transition:width 120ms linear"></span></div>
        <p class="stageText" style="margin:0;color:var(--muted);font-size:.92rem;line-height:1.5;">Opening item and preparing the direct link.</p>
      </div>
    </div>
  </div>

  <script>
    const fallbackManifest = { appName: "MozLaunch", subtitle: "by SkyeMoz", items: [] };
    const state = { manifest: fallbackManifest, filter: "All", query: "" };
    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countBadge = document.getElementById("countBadge");
    const totalCount = document.getElementById("totalCount");
    const gamesCount = document.getElementById("gamesCount");
    const appsCount = document.getElementById("appsCount");
    const heroTitle = document.getElementById("heroTitle");
    const heroSubtitle = document.getElementById("heroSubtitle");
    const navTitle = document.getElementById("navTitle");
    const navSubtitle = document.getElementById("navSubtitle");
    const chips = [...document.querySelectorAll(".chip")];
    const navLinks = [...document.querySelectorAll(".navLink")];
    const logoButton = document.getElementById("logoButton");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalSub = document.getElementById("modalSub");
    const stageLabel = document.getElementById("stageLabel");
    const stagePct = document.getElementById("stagePct");
    const modalBar = document.getElementById("modalBar");
    const closeModal = document.getElementById("closeModal");
    let activeLaunch = null, rafId = 0, backgroundSeed = Math.random();

    function esc(v){ return String(v ?? "").replace(/[<>]/g, ""); }
    function fmtDate(v){
      try { return new Intl.DateTimeFormat(undefined, { year:"numeric", month:"short", day:"numeric" }).format(new Date(v)); }
      catch { return esc(v); }
    }

    function iconSvg(n){
      const i = {
        note:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.5h7l3.5 3.5V20a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3.5V7h3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11h8M8 14h8M8 17h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
        gamepad:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10h10a4 4 0 0 1 4 4v.5A3.5 3.5 0 0 1 17.5 18H6.5A3.5 3.5 0 0 1 3 14.5V14a4 4 0 0 1 4-4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.5 13.2h3M10 11.7v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.2 12.6h.01M18 14h.01" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>`,
        spark:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l1.78 5.45L19.5 10.2l-4.18 3.04L16.96 19 12 15.8 7.04 19l1.64-5.76L4.5 10.2l5.72-1.75L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>`,
        file:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.5h7l3.5 3.5V20a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3.5V7h3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11h8M8 14h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
        car:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.3 10.2 7.7 7.4A2 2 0 0 1 9.48 6.3h5.04a2 2 0 0 1 1.78 1.1l1.4 2.8M5 14h14v3a1 1 0 0 1-1 1h-.7a1.3 1.3 0 0 1-1.3-1.3V16H8v.7A1.3 1.3 0 0 1 6.7 18H6a1 1 0 0 1-1-1v-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7 14.2h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8.5" cy="15.9" r="1" stroke="currentColor" stroke-width="1.5"/><circle cx="15.5" cy="15.9" r="1" stroke="currentColor" stroke-width="1.5"/></svg>`,
        tools:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 4.5a4.5 4.5 0 0 0-4.08 6.4L4.6 16.7a1.8 1.8 0 1 0 2.55 2.55l5.8-5.82a4.5 4.5 0 1 0 1.55-8.93Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.3 7.2l1.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
        moon:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.5 3.5a7.5 7.5 0 1 0 5 13.1 8 8 0 1 1-5-13.1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>`
      };
      return i[n] || i.spark;
    }

    function appPreview(item){ return item.thumbnail ? `<img src="${esc(item.thumbnail)}" alt="${esc(item.title)} thumbnail" loading="lazy" />` : `<div class="appIconFallback">${iconSvg(item.icon || item.type?.toLowerCase() || "spark")}</div>`; }
    function normalize(item){ return [item.title,item.description,item.type,item.tag,item.size,item.date].join(" ").toLowerCase(); }

    function filteredItems(){
      const q = state.query.trim().toLowerCase();
      return (state.manifest?.items || []).filter(item => {
        const typeOk = state.filter === "All" || esc(item.type) === state.filter;
        const queryOk = !q || normalize(item).includes(q);
        return typeOk && queryOk;
      });
    }

    function updateStats(items){
      const total = state.manifest?.items?.length || 0;
      const games = (state.manifest?.items || []).filter(i => esc(i.type) === "Games").length;
      const apps = (state.manifest?.items || []).filter(i => esc(i.type) === "Apps").length;
      totalCount.textContent = total;
      gamesCount.textContent = games;
      appsCount.textContent = apps;
      countBadge.textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;
    }

    function cardTone(item){
      const type = esc(item.type);
      if(type === "Games") return { a: "#7c5cff", b: "#2f6bff", soft: "rgba(124,92,255,.12)" };
      if(type === "Apps") return { a: "#2f6bff", b: "#43b2ff", soft: "rgba(47,107,255,.12)" };
      if(type === "File") return { a: "#00c2ff", b: "#22c55e", soft: "rgba(0,194,255,.12)" };
      return { a: "#2f6bff", b: "#7c5cff", soft: "rgba(47,107,255,.12)" };
    }

    function render(){
      const items = filteredItems();
      updateStats(items);
      grid.innerHTML = "";
      if(!items.length){
        grid.innerHTML = `<div class="empty">No matching items found. Add items in <code>settings/manifest.json</code>.</div>`;
        return;
      }
      items.forEach((item, index) => {
        const tone = cardTone(item);
        const card = document.createElement("article");
        card.className = "card";
        card.style.animationDelay = `${index * 55}ms`;
        card.style.setProperty("--card-accent", tone.a);
        card.style.setProperty("--card-accent-2", tone.b);
        card.style.setProperty("--card-soft", tone.soft);
        card.innerHTML = `
          <div class="cardGlow"></div>
          <div class="cardTop">
            <div class="appInfo">
              <div class="appThumb" aria-hidden="true">${appPreview(item)}</div>
              <div class="appText">
                <div class="titleRow">
                  <h2>${esc(item.title)}</h2>
                  <span class="tag">${esc(item.tag || item.type || "Item")}</span>
                </div>
                <p class="desc">${esc(item.description)}</p>
              </div>
            </div>
          </div>
          <div class="meta">
            <span class="metaItem"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M7 3.5v2M17 3.5v2M5 8.5h14M6.5 6.5h11A1.5 1.5 0 0 1 19 8v10.5A1.5 1.5 0 0 1 17.5 20h-11A1.5 1.5 0 0 1 5 18.5V8A1.5 1.5 0 0 1 6.5 6.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>${fmtDate(item.date)}</span>
            <span class="metaItem"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 12h12M6 8h7M6 16h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>${esc(item.size || "")}</span>
          </div>
          <div class="progress" aria-hidden="true">
            <div class="progressTop"><span class="pStage">Ready</span><span class="pPct">0%</span></div>
            <div class="bar"><span></span></div>
          </div>
          <div class="actions"><button class="launchBtn" type="button">Launch</button></div>
        `;
        const btn = card.querySelector(".launchBtn");
        const progress = card.querySelector(".progress");
        const pStage = card.querySelector(".pStage");
        const pPct = card.querySelector(".pPct");
        const bar = card.querySelector(".bar > span");
        const stages = ["Loading package","Optimizing assets","Building session","Opening link"];
        btn.addEventListener("click", () => startLaunch({
          title: esc(item.title), sub: esc(item.description),
          progress, pStage, pPct, bar, button: btn, stages, link: item.launch
        }));
        grid.appendChild(card);
      });
    }

    function setFilter(filter){
      state.filter = filter;
      chips.forEach(c => c.classList.toggle("active", c.dataset.filter === filter));
      render();
      highlightNav(filter === "All" ? "all" : filter.toLowerCase());
    }
    chips.forEach(chip => chip.addEventListener("click", () => setFilter(chip.dataset.filter)));
    searchInput.addEventListener("input", () => { state.query = searchInput.value; render(); });

    function openModal(title, sub){
      modalTitle.textContent = title || "Launching";
      modalSub.textContent = sub || "Preparing launch";
      modal.style.display = "grid";
      modal.setAttribute("aria-hidden","false");
    }
    function closeLaunchModal(){
      modal.style.display = "none";
      modal.setAttribute("aria-hidden","true");
    }
    closeModal.addEventListener("click", () => {
      if(activeLaunch?.button) activeLaunch.button.disabled = false;
      activeLaunch = null;
      closeLaunchModal();
    });
    modal.addEventListener("click", e => {
      if(e.target === modal){
        if(activeLaunch?.button) activeLaunch.button.disabled = false;
        activeLaunch = null;
        closeLaunchModal();
      }
    });

    logoButton.addEventListener("click", () => { window.scrollTo({ top: 0, behavior: "smooth" }); highlightNav("top"); });
    logoButton.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
        highlightNav("top");
      }
    });

    function goToLink(link){
      const safeLink = String(link || "").trim();
      if(!safeLink || safeLink === "#") return;
      if(safeLink.startsWith("#")){
        const el = document.querySelector(safeLink);
        if(el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        history.replaceState(null, "", safeLink);
        return;
      }
      if(safeLink.startsWith("./") || safeLink.startsWith("../") || safeLink.startsWith("/")){
        window.location.href = safeLink;
        return;
      }
      try { window.location.href = new URL(safeLink, window.location.href).href; }
      catch { window.location.href = safeLink; }
    }

    function startLaunch(ctx){
      if(activeLaunch) return;
      activeLaunch = ctx;
      ctx.button.disabled = true;
      ctx.progress.classList.add("active");
      ctx.progress.setAttribute("aria-hidden","false");
      openModal(ctx.title, ctx.sub);

      const duration = 1800 + Math.floor(Math.random() * 1800);
      const start = performance.now();
      const totalStages = ctx.stages.length;
      cancelAnimationFrame(rafId);

      const tick = () => {
        const elapsed = performance.now() - start;
        const progress = Math.min(100, Math.round((elapsed / duration) * 100));
        const stageIndex = Math.min(totalStages - 1, Math.floor(progress / (100 / totalStages)));
        ctx.bar.style.width = `${progress}%`;
        ctx.pPct.textContent = `${progress}%`;
        ctx.pStage.textContent = ctx.stages[stageIndex];
        stageLabel.textContent = ctx.stages[stageIndex];
        stagePct.textContent = `${progress}%`;
        modalBar.style.width = `${progress}%`;

        if(progress < 100){
          rafId = requestAnimationFrame(tick);
          return;
        }

        ctx.pStage.textContent = "Teleported";
        stageLabel.textContent = "Teleported";
        stagePct.textContent = "100%";
        setTimeout(() => {
          ctx.progress.classList.remove("active");
          ctx.progress.setAttribute("aria-hidden","true");
          ctx.bar.style.width = "0%";
          ctx.pPct.textContent = "0%";
          ctx.pStage.textContent = "Ready";
          modalBar.style.width = "0%";
          ctx.button.disabled = false;
          activeLaunch = null;
          closeLaunchModal();
          goToLink(ctx.link);
        }, 260);
      };
      rafId = requestAnimationFrame(tick);
    }

    function highlightNav(target){
      navLinks.forEach(link => link.classList.toggle("active", link.dataset.nav === target));
    }
    navLinks.forEach(link => {
      link.addEventListener("click", e => {
        const target = link.getAttribute("href");
        if(!target || !target.startsWith("#")) return;
        const el = document.querySelector(target);
        if(el){
          e.preventDefault();
          el.scrollIntoView({ behavior: "smooth", block: "start" });
          history.replaceState(null, "", target);
          highlightNav(link.dataset.nav);
        }
      });
    });

    async function loadManifest(){
      try{
        const res = await fetch("./settings/manifest.json", { cache:"no-store" });
        if(!res.ok) throw new Error("manifest not found");
        const data = await res.json();
        if(data && Array.isArray(data.items)){
          state.manifest = data;
          heroTitle.textContent = esc(data.appName || "MozLaunch");
          heroSubtitle.textContent = esc(data.subtitle || "by SkyeMoz");
          navTitle.textContent = esc(data.appName || "MozLaunch");
          navSubtitle.textContent = esc(data.subtitle || "by SkyeMoz");
        }
      }catch{
        state.manifest = fallbackManifest;
      }finally{
        render();
      }
    }

    function initBackground(){
      const bg = document.getElementById("bgCanvas"), fx = document.getElementById("fxCanvas");
      const bctx = bg.getContext("2d"), fctx = fx.getContext("2d");
      let w = 0, h = 0, t = 0;
      const bubbles = Array.from({ length: 56 }, () => ({ x: Math.random(), y: Math.random(), r:.9 + Math.random() * 2, a:.06 + Math.random() * .12, vx:(Math.random()-.5)*.00024, vy:(Math.random()-.5)*.00024 }));
      const particles = Array.from({ length: 72 }, () => ({ x: Math.random(), y: Math.random(), vx:(Math.random()-.5)*.00072, vy:(Math.random()-.5)*.00072, r:1 + Math.random()*2.1 }));

      function resize(){
        w = bg.width = fx.width = Math.floor(window.innerWidth * devicePixelRatio);
        h = bg.height = fx.height = Math.floor(window.innerHeight * devicePixelRatio);
        bg.style.width = fx.style.width = window.innerWidth + "px";
        bg.style.height = fx.style.height = window.innerHeight + "px";
      }
      window.addEventListener("resize", resize, { passive:true });
      resize();

      function draw(){
        t += .0025;
        bctx.clearRect(0,0,w,h);
        fctx.clearRect(0,0,w,h);

        const g = bctx.createLinearGradient(0,0,w,h);
        g.addColorStop(0, `rgba(47,107,255,${.10 + Math.sin(t + backgroundSeed) * .02})`);
        g.addColorStop(.5, `rgba(255,255,255,${.03 + Math.cos(t * 1.1) * .01})`);
        g.addColorStop(1, `rgba(124,92,255,${.08 + Math.sin(t * .8 + 1) * .02})`);
        bctx.fillStyle = g;
        bctx.fillRect(0,0,w,h);

        for(const s of bubbles){
          s.x += s.vx; s.y += s.vy;
          if(s.x < -.05) s.x = 1.05;
          if(s.x > 1.05) s.x = -.05;
          if(s.y < -.05) s.y = 1.05;
          if(s.y > 1.05) s.y = -.05;
          bctx.beginPath();
          bctx.fillStyle = `rgba(47,107,255,${s.a})`;
          bctx.arc(s.x*w, s.y*h, s.r*devicePixelRatio, 0, Math.PI*2);
          bctx.fill();
        }

        for(let i=0;i<particles.length;i++){
          const p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if(p.x < -.1) p.x = 1.1;
          if(p.x > 1.1) p.x = -.1;
          if(p.y < -.1) p.y = 1.1;
          if(p.y > 1.1) p.y = -.1;
          const x = p.x*w, y = p.y*h;
          fctx.beginPath();
          fctx.fillStyle = "rgba(96,165,250,.36)";
          fctx.arc(x,y,p.r*devicePixelRatio,0,Math.PI*2);
          fctx.fill();
          for(let j=i+1;j<particles.length;j++){
            const q = particles[j];
            const dx = (p.x-q.x)*w, dy = (p.y-q.y)*h, dist = Math.hypot(dx,dy), maxDist = 170*devicePixelRatio;
            if(dist < maxDist){
              fctx.beginPath();
              fctx.strokeStyle = `rgba(96,165,250,${.08*(1-dist/maxDist)})`;
              fctx.lineWidth = 1;
              fctx.moveTo(x,y);
              fctx.lineTo(q.x*w,q.y*h);
              fctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    document.addEventListener("contextmenu", e => e.preventDefault());
    initBackground();
    loadManifest();
    render();
  </script>
</body>
</html>
